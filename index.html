<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Подпись под иконкой на iPhone: иначе iOS возьмёт длинный <title>
         страницы и обрежет его. Витрина /book подменяет тег на название
         клиники (src/pwa/manifest.ts). -->
    <meta name="apple-mobile-web-app-title" content="Aximo" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#159c91" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Aximo CRM — система для управления процессами, клиентами и командой."
    />
    <title>Aximo CRM</title>

    <!--
      Превью ссылки в мессенджерах. Краулеры WhatsApp/Telegram/Facebook не
      выполняют JS, поэтому og-теги, которые витрина ставит на лету
      (`usePageMeta` в src/pages/public-booking/shell.tsx), им не видны — они
      читают ровно этот файл. Ссылку наружу присылают именно на онлайн-запись,
      поэтому статические og описывают её, а не CRM: иначе пациент получает
      карточку «Aximo CRM — система для управления процессами».

      Значения подставляет плагин bookingMeta() в vite.config.ts из
      VITE_BOOKING_ORG_NAME / VITE_BOOKING_PUBLIC_ORIGIN.

      ⚠ Превью одинаково для всех страниц /book — под конкретного врача его не
      сделать без серверного рендеринга (см. docs/booking-share-preview.md).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__BOOKING_ORG_NAME__" />
    <meta property="og:title" content="Онлайн-запись — __BOOKING_ORG_NAME__" />
    <meta
      property="og:description"
      content="Запишитесь к врачу онлайн: выберите специалиста и удобное время, клиника подтвердит запись по телефону."
    />
    <meta property="og:url" content="__BOOKING_ORIGIN__/book" />
    <meta property="og:image" content="__BOOKING_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1196" />
    <meta property="og:image:height" content="1196" />
    <meta property="og:image:alt" content="__BOOKING_ORG_NAME__" />
    <meta property="og:locale" content="ru_RU" />
    <!-- Логотип квадратный: large_image обрезал бы его по бокам. -->
    <meta name="twitter:card" content="summary" />
    <!--
      Раннее применение темы до загрузки React, чтобы не было белой вспышки
      при обновлении страницы в тёмной теме. Логика и значения должны
      совпадать с src/contexts/color-mode/index.tsx и src/theme.ts.
    -->
    <script>
      (function () {
        try {
          var LIGHT = { slate: "#f1f5f9", gray: "#f4f4f5", neutral: "#f5f5f4" };
          var DARK = {
            navy: "#0f172a",
            mirage: "#18212f",
            mint: "#0d1f1b",
            cinder: "#141319",
            black: "#000000",
          };
          var scheme =
            localStorage.getItem("colorScheme") ||
            localStorage.getItem("colorMode") ||
            "system";
          var mode =
            scheme === "light" || scheme === "dark"
              ? scheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          var bg;
          if (mode === "dark") {
            bg = DARK[localStorage.getItem("darkSurface")] || DARK.navy;
          } else {
            bg = LIGHT[localStorage.getItem("lightSurface")] || LIGHT.slate;
          }
          var root = document.documentElement;
          root.style.backgroundColor = bg;
          root.style.colorScheme = mode;
        } catch (e) {
          /* localStorage недоступен — оставляем дефолтный фон */
        }
      })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Основной entry-поинт приложения -->
    <script type="module" src="/src/index.tsx"></script>

</html>
